<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PID Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Prague Transit Router</h1>
        <div class="search-box">
            <div class="input-group">
                <label>From:</label>
                <input type="text" id="fromInput" placeholder="e.g. Muzeum" autocomplete="off">
                <ul id="fromSuggestions" class="suggestions"></ul>
            </div>
            <div class="input-group">
                <label>To:</label>
                <input type="text" id="toInput" placeholder="e.g. Flora" autocomplete="off">
                <ul id="toSuggestions" class="suggestions"></ul>
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label>Day:</label>
                    <select id="dayInput">
                        <option value="monday">Monday</option>
                        <option value="tuesday">Tuesday</option>
                        <option value="wednesday">Wednesday</option>
                        <option value="thursday">Thursday</option>
                        <option value="friday">Friday</option>
                        <option value="saturday">Saturday</option>
                        <option value="sunday">Sunday</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Time:</label>
                    <input type="time" id="timeInput">
                </div>
            </div>
            <button id="searchBtn">Search Route</button>
        </div>

        <div id="results" class="results-container"></div>

        <div class="admin-panel">
            <details>
                <summary class="admin-header">
                    <h2>Admin</h2>
                    <button id="syncBtn">Sync GTFS Data</button>
                    <span id="syncStatus" class="sync-status"></span>
                </summary>
                <div id="logPanel" class="log-panel">
                    <div class="log-header">
                        <span>Logs</span>
                        <div class="log-controls">
                            <button id="clearLogsBtn" class="small-btn">Clear</button>
                            <label class="toggle-label">
                                <input type="checkbox" id="autoRefreshBtn">
                                Auto-refresh
                            </label>
                        </div>
                    </div>
                    <div id="logContent" class="log-content"></div>
                </div>
            </details>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
